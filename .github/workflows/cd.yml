name: CD

# Runs only on main (after a PR is merged). Pull requests and other branches
# only run CI and the Docker build, never CD.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer run waits instead of cancelling one in progress.
concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  docker:
    name: Docker build
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read

  # Only if CI and the Docker build both passed on this commit.
  push-images:
    name: push image (${{ matrix.service }})
    needs: [ci, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [applications-api, insights-api]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push, tagged with the commit SHA
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}

  # Deploy the images just pushed to both Container Apps, then wait for /health.
  # Signs in as the sdd-3b-g4-github managed identity through OIDC: no password stored.
  deploy:
    name: deploy to Azure Container Apps
    needs: [push-images]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      PREFIX: ${{ vars.PREFIX }}
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - name: Sign in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Point both Container Apps at this commit's images
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update -n "${PREFIX}-api" -g "$RESOURCE_GROUP" \
            --image "${REGISTRY}/applications-api:${GITHUB_SHA}" -o none
          az containerapp update -n "${PREFIX}-insights" -g "$RESOURCE_GROUP" \
            --image "${REGISTRY}/insights-api:${GITHUB_SHA}" -o none

      # A cold start can find the database paused (up to about a minute to resume),
      # then migrations run, so allow up to about 5 minutes per service.
      - name: Wait for /health to return 200
        run: |
          for app in "${PREFIX}-api" "${PREFIX}-insights"; do
            fqdn="$(az containerapp show -n "$app" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)"
            echo "checking https://${fqdn}/health"
            ok=0
            for attempt in $(seq 1 30); do
              status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://${fqdn}/health" || true)"
              echo "attempt ${attempt}: ${status}"
              if [ "$status" = "200" ]; then ok=1; break; fi
              sleep 10
            done
            if [ "$ok" != 1 ]; then
              echo "::error::${app} did not return 200 on /health in time"
              exit 1
            fi
          done
