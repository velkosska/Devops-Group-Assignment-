name: CD

# Runs only on main (after a PR is merged). Pull requests and other branches
# only run CI and the Docker build, never CD.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer run waits instead of cancelling one in progress.
concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  docker:
    name: Docker build
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read

  # Only if CI and the Docker build both passed on this commit.
  push-images:
    name: push image (${{ matrix.service }})
    needs: [ci, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [applications-api, insights-api]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push, tagged with the commit SHA
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}

  # Deploy the images just pushed to both Container Apps, wait for /health,
  # then build the UI against the live API addresses and upload it.
  # Signs in as the sdd-3b-g4-github managed identity through OIDC: no password stored.
  deploy:
    name: deploy to Azure
    needs: [push-images]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      PREFIX: ${{ vars.PREFIX }}
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v7

      - name: Sign in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Point both Container Apps at this commit's images
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update -n "${PREFIX}-api" -g "$RESOURCE_GROUP" \
            --image "${REGISTRY}/applications-api:${GITHUB_SHA}" -o none
          az containerapp update -n "${PREFIX}-insights" -g "$RESOURCE_GROUP" \
            --image "${REGISTRY}/insights-api:${GITHUB_SHA}" -o none

      - name: Look up the live service addresses
        run: |
          api_fqdn="$(az containerapp show -n "${PREFIX}-api" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)"
          insights_fqdn="$(az containerapp show -n "${PREFIX}-insights" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)"
          echo "APPLICATIONS_URL=https://${api_fqdn}" >> "$GITHUB_ENV"
          echo "INSIGHTS_URL=https://${insights_fqdn}" >> "$GITHUB_ENV"
          ui_host="$(az staticwebapp show -n "${PREFIX}-ui" -g "$RESOURCE_GROUP" --query defaultHostname -o tsv)"
          echo "UI_URL=https://${ui_host}" >> "$GITHUB_ENV"

      # A cold start can find the database paused (up to about a minute to resume),
      # then migrations run, so allow up to about 5 minutes per service.
      - name: Wait for /health to return 200
        run: |
          for url in "$APPLICATIONS_URL" "$INSIGHTS_URL"; do
            echo "checking ${url}/health"
            ok=0
            for attempt in $(seq 1 30); do
              status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "${url}/health" || true)"
              echo "attempt ${attempt}: ${status}"
              if [ "$status" = "200" ]; then ok=1; break; fi
              sleep 10
            done
            if [ "$ok" != 1 ]; then
              echo "::error::${url} did not return 200 on /health in time"
              exit 1
            fi
          done

      # Exercises the real feature against the live database: create, read, edit,
      # move, delete. The trap removes the test application if a check fails midway.
      - name: Smoke test both services end to end and CORS for the UI
        run: |
          set -euo pipefail
          api="${APPLICATIONS_URL}/applications"
          json=(-H "Content-Type: application/json")
          funnel_total() { curl -fsS --max-time 30 "${INSIGHTS_URL}/funnel" | jq -er ".total_applications"; }
          before="$(funnel_total)"
          id="$(curl -fsS --max-time 60 -X POST "${json[@]}" \
            -d '{"company": "CD smoke test", "role": "Pipeline check"}' "$api" | jq -er '.id')"
          trap 'curl -sS --max-time 30 -o /dev/null -X DELETE "${api}/${id}" || true' EXIT
          echo "created application ${id}"
          curl -fsS --max-time 30 "$api" | jq -e --argjson id "$id" 'any(.[]; .id == $id)' > /dev/null
          curl -fsS --max-time 30 -X PUT "${json[@]}" \
            -d '{"company": "CD smoke test", "role": "Pipeline check (edited)"}' "${api}/${id}" \
            | jq -e '.role == "Pipeline check (edited)"' > /dev/null
          curl -fsS --max-time 30 -X PATCH "${json[@]}" -d '{"stage": "screen"}' "${api}/${id}/stage" \
            | jq -e '.stage == "screen"' > /dev/null
          # The events crossed to insights-api, which now counts the test application.
          test "$(funnel_total)" -eq "$((before + 1))"
          curl -fsS --max-time 30 -o /dev/null -X DELETE "${api}/${id}"
          trap - EXIT
          status="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "${api}/${id}")"
          test "$status" = "404"
          # Deleted applications drop out of the analytics again (#57).
          test "$(funnel_total)" -eq "$before"
          echo "create, read, edit, move and delete all work, and insights-api counted the test application until it was deleted"
          allowed="$(curl -fsS --max-time 30 -o /dev/null -D - -X OPTIONS \
            -H "Origin: ${UI_URL}" -H "Access-Control-Request-Method: POST" "$api" \
            | tr -d '\r' | grep -i '^access-control-allow-origin:' | cut -d' ' -f2)"
          test "$allowed" = "$UI_URL"
          echo "the board API allows requests from ${UI_URL}"
          allowed="$(curl -fsS --max-time 30 -o /dev/null -D - -X OPTIONS \
            -H "Origin: ${UI_URL}" -H "Access-Control-Request-Method: GET" "${INSIGHTS_URL}/funnel" \
            | tr -d '\r' | grep -i '^access-control-allow-origin:' | cut -d' ' -f2)"
          test "$allowed" = "$UI_URL"
          echo "the insights API allows requests from ${UI_URL}"

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # The API addresses are baked in at build time. Empty values would make the
      # UI fall back to in-browser demo data, so the build fails if either is missing.
      - name: Build the UI against the live services
        working-directory: ui
        env:
          VITE_APPLICATIONS_API_URL: ${{ env.APPLICATIONS_URL }}
          VITE_INSIGHTS_API_URL: ${{ env.INSIGHTS_URL }}
        run: |
          test -n "$VITE_APPLICATIONS_API_URL" && test -n "$VITE_INSIGHTS_API_URL"
          npm ci
          npm run build

      # Read from Azure with the pipeline's identity and masked in the logs,
      # so no extra GitHub secret is needed.
      - name: Get the Static Web App deployment token
        run: |
          token="$(az staticwebapp secrets list -n "${PREFIX}-ui" -g "$RESOURCE_GROUP" --query properties.apiKey -o tsv)"
          echo "::add-mask::${token}"
          echo "SWA_TOKEN=${token}" >> "$GITHUB_ENV"

      - name: Upload the UI to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: upload
          app_location: ui/dist
          output_location: ""
          skip_app_build: true
          skip_api_build: true

      - name: Check the live UI loads
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 15 -o /dev/null "${UI_URL}/board"; then
              echo "UI loads at ${UI_URL}"
              exit 0
            fi
            echo "attempt ${attempt}: not yet"
            sleep 10
          done
          echo "::error::${UI_URL} did not load after the upload"
          exit 1
