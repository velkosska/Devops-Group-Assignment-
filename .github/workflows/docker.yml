name: Docker build

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-dockerfiles:
    name: lint Dockerfiles (hadolint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: applications-api/Dockerfile

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: insights-api/Dockerfile

  build:
    name: build image (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [applications-api, insights-api]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built but not pushed: CI only proves the image builds. Pushing to GHCR
      # happens in the deploy workflow after merge to main.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          load: true
          tags: ${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Image must run as a non-root user
        run: |
          user="$(docker image inspect "${{ matrix.service }}:ci" --format '{{.Config.User}}')"
          echo "image user: ${user:-<none>}"
          test -n "$user" && test "$user" != "root" && test "$user" != "0"

  # Local stack against SQL Server in compose. Never touches Azure SQL.
  compose-smoke:
    name: compose smoke (health)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Start compose stack
        run: docker compose up --build -d

      - name: Wait for /health on both services
        run: |
          for port in 8000 8001; do
            ok=0
            for _ in $(seq 1 60); do
              if curl -sf "http://127.0.0.1:${port}/health" >/dev/null; then
                echo "port ${port} healthy"
                ok=1
                break
              fi
              sleep 5
            done
            test "$ok" = 1
          done

      - name: Show compose logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down compose stack
        if: always()
        run: docker compose down -v
